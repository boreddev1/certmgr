# nginx-Fragmente fuer das mTLS-Gate.
#
# Zwei Ergaenzungen an ~/ai-stack/config/nginx/open-webui.conf:
#
# 1. Location /certmgr/ im bestehenden 8443-Block (LAN-only).
#    Der Certmgr-Admin laeuft auf 127.0.0.1:8104. Nur ueber diese
#    Location erreichbar - der Port selbst ist nie im LAN.
#
# 2. Ein eigener Server-Block auf 127.0.0.1:8445 fuer ki.boreddev1.cc.
#    Das ist der Origin hinter dem Cloudflare-Tunnel. Die TLS-Terminierung
#    und die mTLS-Pruefung passieren an der Cloudflare-Edge.
#
# WICHTIG: 8443 und 8444 bleiben LAN-only (kein CNAME darauf), und 8445
# bindet auf 127.0.0.1. Andernfalls kaeme man am mTLS-Gate vorbei
# direkt an Open WebUI.
#
# Einfuegen mit scripts/install.sh oder von Hand.

# --- Teil 1: in den bestehenden Server-Block auf Port 8443 ----------------

    # Cert-Manager: Admin-Oberflaeche fuer die Client-Zertifikate des
    # mTLS-Gates. Nur im LAN erreichbar - der Dienst selbst bindet auf
    # Loopback, und der Onboarding-Port haengt am Cloudflare-Tunnel.
    location /certmgr/ {
        proxy_pass http://127.0.0.1:8104/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /certmgr { return 301 /certmgr/; }

# --- Teil 2: eigener Server-Block als Dateiende ---------------------------

# ------------------------------------------------------- Cloudflare-Origin --
# Origin fuer ki.boreddev1.cc. TLS terminiert die Cloudflare-Edge, hier
# kommt reines HTTP an. Bewusst ein eigener Port und ein eigener Block:
# die 8443/8444-Bloecke sind LAN-only und duerfen NICHT vom Internet
# erreichbar sein - sonst kaeme man am mTLS-Gate vorbei direkt an
# Open WebUI.
#
# WICHTIG: Dieser Port bindet auf 127.0.0.1, NICHT auf 0.0.0.0. Sonst
# waere Open WebUI im LAN direkt erreichbar - ohne mTLS, ohne die
# Cloudflare-Edge. Der Tunnel erreicht 127.0.0.1:8445 problemlos.
#
# Die mTLS-Durchsetzung passiert an der Cloudflare-Edge (WAF-Regel auf
# cf.tls_client_auth). Hier laeuft nur der Content.
server {
    listen 127.0.0.1:8445;
    server_name ki.boreddev1.cc;

    # SSE: Open WebUI streamt Token fuer Token. Ohne das Limit bricht
    # nginx laengere Antworten ab.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WICHTIG: die Edge ist TLS, also muss hier https ankommen.
        # Ohne das baut Open WebUI falsche URLs und verweigert ggf.
        # die WebSocket-Verbindung.
        proxy_set_header X-Forwarded-Proto https;
    }
}
